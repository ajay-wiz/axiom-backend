# Server
server.port=8080
server.servlet.context-path=/api

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# File Storage
app.upload.dir=./uploads
app.upload.media-dir=./uploads/media
app.upload.thumbnail-dir=./uploads/thumbnails

# JWT
app.jwt.secret=${JWT_SECRET:MyUltraSecureJwtSecretKeyForPortfolioWebsite2026HS512EncryptionVeryStrongSecretKey123456789}
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=${CORS_URLS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:dlvv6vrsb}
cloudinary.api_key=${CLOUDINARY_API_KEY:613448468383191}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:xRDz77nKe2lB8vRYLP2Edhr-O54}

# Logging
logging.level.com.portfolio=INFO
logging.level.org.springframework.security=WARN